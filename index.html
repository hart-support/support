<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HART — Project & Support</title>
  <style>
    :root {
      --bg: #121110;
      --card: #1b1917;
      --card-soft: #23201d;
      --text: #f3f2f0;
      --muted: #b0aba4;
      --accent: #e06d1b;
      --accent-bright: #f27b24;
      --border-orange: rgba(224, 109, 27, 0.55);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --card-glow: 0 0 28px rgba(224, 109, 27, 0.16), 0 14px 34px rgba(0, 0, 0, 0.5);
      --btn-glow: 0 0 22px rgba(224, 109, 27, 0.36), 0 6px 18px rgba(0, 0, 0, 0.35);
      --btn-glow-hover: 0 0 32px rgba(242, 123, 36, 0.56), 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      line-height: 1.5;
    }

    .wrap {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .pill {
      background: var(--card);
      border: 1px solid var(--border-orange);
      color: var(--accent-bright);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(224, 109, 27, 0.18);
    }

    .lang-bar {
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--text);
      border-color: var(--border-orange);
    }

    .lang-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(224, 109, 27, 0.42);
    }

    .stage-wrap {
      position: relative;
      padding-top: 52px;
    }

    .mascot-aura {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 128px;
      height: 116px;
      background: radial-gradient(circle, rgba(242, 123, 36, 0.42) 0%, rgba(224, 109, 27, 0.08) 58%, transparent 75%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 1;
    }

    .mascot-peek {
      position: relative;
      z-index: 2;
      display: block;
      margin: 0 auto -14px auto;
      width: 98px;
      height: 98px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
    }
