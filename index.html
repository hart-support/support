<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HART — Project & Support</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card: #18181c;
      --text: #f4f4f6;
      --muted: #a1a1aa;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --border: #27272d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f1915 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.55;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid rgba(249, 115, 22, 0.28);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .lang-switch {
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--text);
      border-color: #3f3f48;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 14px;
    }

    .note {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 22px;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 20px;
      border-radius: 14px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .footer {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="top-bar">
      <span class="badge" id="badge">HART</span>
      <div class="lang-switch" aria-label="Language switcher">
        <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UK</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="pl" onclick="setLang('pl')">PL</button>
      </div>
    </div>

    <h1 id="title"></h1>
    <p id="desc"></p>
    <div class="note" id="note"></div>

    <!-- Замініть посилання нижче на своє -->
    <a class="btn" id="cta" href="https://send.monobank.ua/YOUR_JAR_ID" target="_blank" rel="noopener noreferrer"></a>

    <div class="footer" id="footer"></div>
  </main>

  <script>
    const translations = {
      uk: {
        title: "Проєкт і підтримка",
        desc: "Застосунок створюється для зручних тренувань, харчування та відстеження прогресу без зайвого шуму.",
        note: "Усі функції працюють без обмежень. Підтримка — повністю добровільна та допомагає приділяти більше часу оновленням і стабільності.",
        cta: "Підтримати розвиток",
        footer: "Дякуємо, що користуєтесь застосунком і ділитесь відгуками."
      },
      en: {
        title: "Project & Support",
        desc: "The app is built for workouts, nutrition, and progress tracking without unnecessary clutter.",
        note: "All features work without restrictions. Support is completely voluntary and helps dedicate more time to updates and stability.",
        cta: "Support development",
        footer: "Thank you for using the app and sharing your feedback."
      },
      pl: {
        title: "Projekt i wsparcie",
        desc: "Aplikacja powstała z myślą o treningach, żywieniu i śledzeniu postępów bez zbędnego szumu.",
        note: "Wszystkie funkcje działają bez ograniczeń. Wsparcie jest całkowicie dobrowolne i pomaga poświęcać więcej czasu na aktualizacje oraz stabilność.",
        cta: "Wesprzyj rozwój",
        footer: "Dziękujemy za korzystanie z aplikacji i dzielenie się opiniami."
      }
    };

    function setLang(lang) {
      const t = translations[lang] || translations.uk;
      document.documentElement.lang = lang;
      document.getElementById("title").textContent = t.title;
      document.getElementById("desc").textContent = t.desc;
      document.getElementById("note").textContent = t.note;
      document.getElementById("cta").textContent = t.cta;
      document.getElementById("footer").textContent = t.footer;

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    setLang("uk");
  </script>
</body>
</html>
